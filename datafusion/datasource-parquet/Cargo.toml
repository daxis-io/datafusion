[package]
name = "datafusion-datasource-parquet"
description = "datafusion-datasource-parquet"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
arrow = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
datafusion-common = { workspace = true, features = ["object_store", "parquet"] }
datafusion-common-runtime = { workspace = true, default-features = false }
datafusion-datasource = { workspace = true, default-features = false }
datafusion-execution = { workspace = true, default-features = false }
datafusion-expr = { workspace = true }
datafusion-functions = { workspace = true }
datafusion-functions-aggregate-common = { workspace = true }
datafusion-physical-expr = { workspace = true, default-features = false }
datafusion-physical-expr-adapter = { workspace = true }
datafusion-physical-expr-common = { workspace = true }
datafusion-physical-plan = { workspace = true, default-features = false }
datafusion-proto-models = { workspace = true, optional = true }
datafusion-pruning = { workspace = true }
datafusion-session = { workspace = true, default-features = false }
futures = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
object_store = { workspace = true }
parking_lot = { workspace = true }
parquet = { workspace = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
tokio = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
criterion = { workspace = true }
datafusion-functions = { workspace = true }
datafusion-functions-nested = { workspace = true }
tempfile = { workspace = true }

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[lib]
name = "datafusion_datasource_parquet"
path = "src/mod.rs"

[features]
default = [
    "compression",
    "disk",
    "object-store-reader",
    "parquet-read",
    "parquet-write",
    "runtime-tokio",
    "spill",
    "temp-path",
]
compression = [
    "parquet/brotli",
    "parquet/flate2-zlib-rs",
    "parquet/lz4",
    "parquet/snap",
    "parquet/zstd",
]
disk = ["datafusion-datasource/disk", "datafusion-execution/disk"]
object-store-reader = ["parquet-read", "parquet/async"]
# The exact browser overlay supplies Parquet's candidate-only `async-core`
# feature. It cannot be named here because crates.io Parquet 59.3.0 does not
# publish that feature; `parquet/async` would reintroduce Tokio on WASM.
parquet-read = ["parquet/arrow"]
parquet-write = [
    "datafusion-datasource/writes",
    "parquet/arrow",
    "parquet/async",
]
proto = [
    "parquet-read",
    "dep:datafusion-proto-models",
    "datafusion-datasource/proto",
    "datafusion-physical-plan/proto",
]
parquet_encryption = [
    "parquet/encryption",
    "datafusion-common/parquet_encryption",
    "datafusion-execution/parquet_encryption",
]
runtime-browser = [
    "datafusion-common-runtime/runtime-browser",
    "datafusion-datasource/runtime-browser",
    "datafusion-execution/runtime-browser",
    "datafusion-physical-expr/runtime-browser",
    "datafusion-physical-plan/runtime-browser",
    "datafusion-session/runtime-browser",
]
runtime-tokio = [
    "datafusion-common-runtime/runtime-tokio",
    "datafusion-datasource/runtime-tokio",
    "datafusion-execution/runtime-tokio",
    "datafusion-physical-expr/runtime-tokio",
    "datafusion-physical-plan/runtime-tokio",
    "datafusion-session/runtime-tokio",
]
spill = ["datafusion-execution/spill", "datafusion-physical-plan/spill"]
temp-path = ["datafusion-datasource/temp-path", "datafusion-execution/temp-path"]

[[bench]]
name = "parquet_nested_filter_pushdown"
harness = false

[[bench]]
name = "parquet_struct_filter_pushdown"
harness = false

[[bench]]
name = "parquet_metadata_statistics"
harness = false
