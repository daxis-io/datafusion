[package]
name = "datafusion"
description = "DataFusion is an in-memory query engine that uses Apache Arrow as the memory model"
keywords = ["arrow", "query", "sql"]
include = ["benches/*.rs", "src/**/*.md", "src/**/*.rs", "Cargo.toml", "LICENSE.txt", "NOTICE.txt"]
readme = "../../README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[features]
arrow = ["dep:datafusion-datasource-arrow", "listing"]
nested_expressions = ["datafusion-functions-nested"]
# This feature is deprecated. Use the `nested_expressions` feature instead.
array_expressions = ["nested_expressions"]
# Used to enable the avro format
avro = ["datafusion-datasource-avro", "listing"]
backtrace = ["datafusion-common/backtrace"]
browser = ["runtime-browser", "chrono/wasmbind"]
catalog-stream = ["listing", "datafusion-catalog/catalog-stream"]
compression = [
    "liblzma",
    "bzip2",
    "flate2",
    "zstd",
    "datafusion-datasource-arrow?/compression",
    "datafusion-datasource/compression",
    "datafusion-datasource-parquet?/compression",
]
csv = ["dep:datafusion-datasource-csv", "listing"]
crypto_expressions = ["datafusion-functions/crypto_expressions"]
datetime_expressions = ["datafusion-functions/datetime_expressions"]
default = [
    "nested_expressions",
    "crypto_expressions",
    "datetime_expressions",
    "encoding_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
    "arrow",
    "catalog-stream",
    "compression",
    "csv",
    "disk",
    "json",
    "parquet",
    "recursive_protection",
    "runtime-tokio",
    "spill",
    "sql",
    "temp-path",
    "writes",
]
disk = ["datafusion-datasource/disk", "datafusion-execution/disk"]
encoding_expressions = ["datafusion-functions/encoding_expressions"]
# Used for testing ONLY: causes all values to hash to the same value (test for collisions)
force_hash_collisions = ["datafusion-physical-plan/force_hash_collisions", "datafusion-common/force_hash_collisions"]
math_expressions = ["datafusion-functions/math_expressions"]
json = ["dep:datafusion-datasource-json", "listing"]
listing = ["dep:datafusion-catalog-listing"]
parquet = [
    "datafusion-common/parquet",
    "dep:parquet",
    "parquet/arrow",
    "dep:datafusion-datasource-parquet",
    "datafusion-datasource-parquet/parquet-read",
    "datafusion-datasource-parquet/object-store-reader",
    "disk",
    "listing",
    "runtime-tokio",
]
parquet_encryption = [
    "parquet",
    "parquet/encryption",
    "datafusion-common/parquet_encryption",
    "datafusion-datasource-parquet/parquet_encryption",
]
regex_expressions = [
    "datafusion-functions/regex_expressions",
]
recursive_protection = [
    "datafusion-common/recursive_protection",
    "datafusion-expr/recursive_protection",
    "datafusion-optimizer/recursive_protection",
    "datafusion-physical-optimizer/recursive_protection",
    "datafusion-physical-expr/recursive_protection",
    "datafusion-sql?/recursive_protection",
    "sqlparser?/recursive-protection",
]
runtime-browser = [
    "datafusion-catalog/runtime-browser",
    "datafusion-common-runtime/runtime-browser",
    "datafusion-datasource/runtime-browser",
    "datafusion-datasource-parquet?/runtime-browser",
    "datafusion-execution/runtime-browser",
    "datafusion-physical-expr/runtime-browser",
    "datafusion-physical-plan/runtime-browser",
    "datafusion-session/runtime-browser",
]
runtime-tokio = [
    "datafusion-catalog/runtime-tokio",
    "datafusion-common-runtime/runtime-tokio",
    "datafusion-datasource/runtime-tokio",
    "datafusion-datasource-parquet?/runtime-tokio",
    "datafusion-execution/runtime-tokio",
    "datafusion-physical-expr/runtime-tokio",
    "datafusion-physical-plan/runtime-tokio",
    "datafusion-session/runtime-tokio",
]
serde = [
    "dep:serde",
    # Enable `#[cfg_attr(feature = "serde", derive(serde::Serialize, serde::Deserialize))]`
    # statements in `arrow-schema` crate
    "arrow-schema/serde",
]
sql = [
    "datafusion-common/sql",
    "datafusion-functions-nested?/sql",
    "datafusion-sql",
    "sqlparser",
]
spill = ["datafusion-execution/spill", "datafusion-physical-plan/spill"]
string_expressions = ["datafusion-functions/string_expressions"]
unicode_expressions = [
    "datafusion-sql?/unicode_expressions",
    "datafusion-functions/unicode_expressions",
]
temp-path = ["datafusion-datasource/temp-path", "datafusion-execution/temp-path"]
writes = [
    "datafusion-catalog-listing?/writes",
    "datafusion-datasource/writes",
    "datafusion-datasource-parquet?/parquet-write",
    "listing",
]
extended_tests = []

[dependencies]
arrow = { workspace = true }
arrow-schema = { workspace = true, features = ["canonical_extension_types"] }
async-trait = { workspace = true }
bzip2 = { workspace = true, optional = true }
chrono = { workspace = true }
datafusion-catalog = { workspace = true, default-features = false }
datafusion-catalog-listing = { workspace = true, optional = true }
datafusion-common = { workspace = true, features = ["object_store"] }
datafusion-common-runtime = { workspace = true, default-features = false }
datafusion-datasource = { workspace = true, default-features = false }
datafusion-datasource-arrow = { workspace = true, optional = true }
datafusion-datasource-avro = { workspace = true, optional = true }
datafusion-datasource-csv = { workspace = true, optional = true }
datafusion-datasource-json = { workspace = true, optional = true }
datafusion-datasource-parquet = { workspace = true, optional = true }
datafusion-execution = { workspace = true, default-features = false }
datafusion-expr = { workspace = true, default-features = false }
datafusion-expr-common = { workspace = true }
datafusion-functions = { workspace = true }
datafusion-functions-aggregate = { workspace = true }
datafusion-functions-nested = { workspace = true, default-features = false, optional = true }
datafusion-functions-table = { workspace = true }
datafusion-functions-window = { workspace = true }
datafusion-optimizer = { workspace = true }
datafusion-physical-expr = { workspace = true, default-features = false }
datafusion-physical-expr-adapter = { workspace = true }
datafusion-physical-expr-common = { workspace = true }
datafusion-physical-optimizer = { workspace = true }
datafusion-physical-plan = { workspace = true, default-features = false }
datafusion-session = { workspace = true, default-features = false }
datafusion-sql = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
futures = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
liblzma = { workspace = true, optional = true }
log = { workspace = true }
object_store = { workspace = true }
parking_lot = { workspace = true }
parquet = { workspace = true, optional = true, default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
sqlparser = { workspace = true, optional = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "js"] }
zstd = { workspace = true, optional = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
async-trait = { workspace = true }
criterion = { workspace = true, features = ["async_tokio", "async_futures"] }
ctor = { workspace = true }
dashmap = "6.2.1"
datafusion-doc = { workspace = true }
datafusion-functions-window-common = { workspace = true }
datafusion-macros = { workspace = true }
datafusion-physical-optimizer = { workspace = true }
doc-comment = { workspace = true }
bytes = { workspace = true }
env_logger = { workspace = true }
glob = { workspace = true }
insta = { workspace = true }
half = { workspace = true }
rand = { workspace = true, features = ["small_rng"] }
rand_distr = "0.5"
recursive = { workspace = true }
regex = { workspace = true }
rstest = { workspace = true }
serde_json = { workspace = true }
sysinfo = "0.39.3"
test-utils = { path = "../../test-utils" }
tokio = { workspace = true, features = ["rt-multi-thread", "parking_lot", "fs"] }

[package.metadata.cargo-machete]
# getrandom selects the browser entropy backend for transitive users.
ignored = ["datafusion-doc", "datafusion-macros", "dashmap", "getrandom"]

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
nix = { version = "0.31.3", features = ["fs"] }

