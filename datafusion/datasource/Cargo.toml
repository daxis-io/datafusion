[package]
name = "datafusion-datasource"
description = "datafusion-datasource"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
backtrace = ["datafusion-common/backtrace"]
compression = ["async-compression", "liblzma", "bzip2", "flate2", "zstd", "tokio-util"]
default = ["compression", "runtime-tokio", "temp-path", "writes"]
# Enables protobuf conversions for datasource types, source serialization hooks,
# and the shared `FileScanConfig` <-> proto conversion. Off by default so
# consumers that never serialize plans pay nothing. Mirrors the `proto` feature
# on `datafusion-physical-plan`.
proto = [
    "dep:datafusion-proto-models",
    "datafusion-physical-plan/proto",
]
runtime-browser = [
    "datafusion-common-runtime/runtime-browser",
    "datafusion-execution/runtime-browser",
    "datafusion-physical-expr/runtime-browser",
    "datafusion-physical-plan/runtime-browser",
    "datafusion-session/runtime-browser",
]
runtime-tokio = [
    "datafusion-common-runtime/runtime-tokio",
    "datafusion-execution/runtime-tokio",
    "datafusion-physical-expr/runtime-tokio",
    "datafusion-physical-plan/runtime-tokio",
    "datafusion-session/runtime-tokio",
]
temp-path = ["dep:tempfile"]
writes = ["dep:rand"]

[dependencies]
arrow = { workspace = true }
async-compression = { version = "0.4.40", features = [
    "bzip2",
    "gzip",
    "xz",
    "zstd",
    "tokio",
], optional = true }
async-trait = { workspace = true }
bytes = { workspace = true }
bzip2 = { workspace = true, optional = true }
chrono = { workspace = true }
datafusion-common = { workspace = true, features = ["object_store"] }
datafusion-common-runtime = { workspace = true, default-features = false }
datafusion-execution = { workspace = true, default-features = false }
datafusion-expr = { workspace = true }
datafusion-physical-expr = { workspace = true, default-features = false }
datafusion-physical-expr-adapter = { workspace = true }
datafusion-physical-expr-common = { workspace = true }
datafusion-physical-plan = { workspace = true, default-features = false }
datafusion-proto-models = { workspace = true, optional = true }
datafusion-session = { workspace = true, default-features = false }
flate2 = { workspace = true, optional = true }
futures = { workspace = true }
glob = { workspace = true }
itertools = { workspace = true }
liblzma = { workspace = true, optional = true }
log = { workspace = true }
object_store = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio-util = { version = "0.7.17", features = ["io"], optional = true }
url = { workspace = true }
zstd = { workspace = true, optional = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
tokio = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
datafusion-functions = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[lib]
name = "datafusion_datasource"
path = "src/mod.rs"

[[bench]]
name = "split_groups_by_statistics"
harness = false
