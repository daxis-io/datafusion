[package]
name = "datafusion-wasmtest"
description = "Test library to compile datafusion crates to wasm"
readme = "README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
publish = false

[package.metadata.docs.rs]
all-features = true

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
console_error_panic_hook = ["dep:console_error_panic_hook"]
exact-stack-parquet = [
    "dep:bytes",
    "dep:datafusion-datasource",
    "dep:datafusion-datasource-parquet",
    "dep:parquet",
    "parquet/experimental",
]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true, optional = true }
console_error_panic_hook = { version = "0.1.1", optional = true }
datafusion = { workspace = true, default-features = false, features = ["browser", "sql"] }
datafusion-common-runtime = { workspace = true, default-features = false, features = ["runtime-browser"] }
datafusion-datasource = { workspace = true, default-features = false, features = ["runtime-browser"], optional = true }
datafusion-datasource-parquet = { workspace = true, default-features = false, features = [
    "parquet-read",
    "runtime-browser",
], optional = true }
futures = { workspace = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
parquet = { workspace = true, default-features = false, features = ["arrow"], optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
wasm-bindgen = "=0.2.118"
wasm-bindgen-futures = "=0.4.68"

[package.metadata.cargo-machete]
# datafusion-execution restores native capabilities for workspace test builds.
ignored = ["datafusion-execution", "getrandom", "wasm-bindgen-futures"]

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
datafusion-execution = { workspace = true, features = [
    "disk",
    "runtime-tokio",
    "spill",
    "temp-path",
] }
