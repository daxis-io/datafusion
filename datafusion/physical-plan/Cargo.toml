[package]
name = "datafusion-physical-plan"
description = "Physical (ExecutionPlan) implementations for DataFusion query engine"
keywords = ["arrow", "query", "sql"]
readme = "README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[features]
default = ["runtime-tokio", "spill"]
force_hash_collisions = []
runtime-browser = [
    "datafusion-common-runtime/runtime-browser",
    "datafusion-execution/runtime-browser",
    "datafusion-physical-expr/runtime-browser",
]
runtime-tokio = [
    "datafusion-common-runtime/runtime-tokio",
    "datafusion-execution/runtime-tokio",
    "datafusion-physical-expr/runtime-tokio",
    "tokio/time",
]
spill = ["arrow-ipc/lz4", "arrow-ipc/zstd", "datafusion-execution/spill"]
test_utils = ["arrow/test_utils"]
tokio_coop = []
tokio_coop_fallback = []
# Enables `PhysicalExpr::try_to_proto` / `try_from_proto` hooks on the
# physical expressions defined in this crate (e.g. `HashExpr`). Off by
# default so consumers that never serialize plans pay nothing.
proto = [
    "dep:datafusion-proto-models",
    "dep:datafusion-proto-common",
    "datafusion-physical-expr/proto",
    "datafusion-physical-expr-common/proto",
]

[lib]
name = "datafusion_physical_plan"

[dependencies]
arrow = { workspace = true }
arrow-data = { workspace = true }
# Spill IPC writes require lz4 and zstd codec support. Keep these features in
# sync with the SpillCompression variants in datafusion-common so codec
# availability is explicit in the crate that owns spill handling.
arrow-ipc = { workspace = true }
arrow-ord = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
datafusion-common = { workspace = true }
datafusion-common-runtime = { workspace = true, default-features = false }
datafusion-execution = { workspace = true, default-features = false }
datafusion-expr = { workspace = true }
datafusion-functions = { workspace = true }
datafusion-functions-aggregate-common = { workspace = true }
datafusion-functions-window-common = { workspace = true }
datafusion-physical-expr = { workspace = true, default-features = false }
datafusion-physical-expr-common = { workspace = true }
datafusion-proto-common = { workspace = true, optional = true }
datafusion-proto-models = { workspace = true, optional = true }
futures = { workspace = true }
half = { workspace = true }
hashbrown = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true, features = ["use_std"] }
log = { workspace = true }
num-traits = { workspace = true }
parking_lot = { workspace = true }
pin-project-lite = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
tokio = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
arrow-data = { workspace = true }
criterion = { workspace = true, features = ["async_futures"] }
datafusion-functions-aggregate = { workspace = true }
datafusion-functions-window = { workspace = true }
insta = { workspace = true }
rand = { workspace = true }
rstest = { workspace = true }
rstest_reuse = "0.7.0"
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "fs",
    "parking_lot",
] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.68"

[[bench]]
harness = false
name = "partial_ordering"

[[bench]]
harness = false
name = "spill_io"

[[bench]]
harness = false
name = "sort_preserving_merge"

[[bench]]
harness = false
name = "sort_merge_join"
required-features = ["test_utils"]

[[bench]]
harness = false
name = "aggregate_vectorized"
required-features = ["test_utils"]

[[bench]]
harness = false
name = "compute_statistics"

[[bench]]
harness = false
name = "dictionary_group_values"

[[bench]]
harness = false
name = "hash_join_semi_anti"
required-features = ["test_utils"]

[[bench]]
harness = false
name = "multi_group_by"
required-features = ["test_utils"]

[[bench]]
harness = false
name = "bounded_window"
